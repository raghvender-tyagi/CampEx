{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - CampusEx{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <div class="card shadow p-4 p-md-5">
            <div class="text-center mb-4">
                <i data-lucide="log-in" class="mb-2" style="width: 2.25rem; height: 2.25rem; stroke-width: 1.5; color: var(--accent-color);"></i>
                <h2 class="h2-title mb-1">Welcome Back</h2>
                <p class="text-muted meta-text mb-0">Sign in to your college marketplace account</p>
            </div>
            
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    {{ form|crispy }}
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2.5">
                    <span>Sign In</span>
                </button>
            </form>
            
            <div class="text-center mt-4">
                <span class="meta-text text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-medium" style="color: var(--accent-color);">Register</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
