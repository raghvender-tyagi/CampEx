{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Campus Exchange{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 mt-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="font-family: 'Outfit', sans-serif;">Welcome Back</h2>
                <p class="text-muted">Sign in to your Campus Exchange account</p>
            </div>
            
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-custom w-100 mt-3 py-2">Login</button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-muted">Don't have an account yet? <a href="{% url 'register' %}" class="text-info text-decoration-none fw-semibold">Register here</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
