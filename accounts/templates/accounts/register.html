{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register - Campus Exchange{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 mt-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="font-family: 'Outfit', sans-serif;">Create an Account</h2>
                <p class="text-muted">Register with your college email address</p>
            </div>
            
            <form method="post" novalidate>
                {% csrf_token %}
                <!-- crispy filter pure form ko styled inputs me tabdeel kar dega -->
                {{ form|crispy }}
                <button type="submit" class="btn btn-custom w-100 mt-3 py-2">Sign Up</button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-info text-decoration-none fw-semibold">Login here</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
